<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - FastPrint</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<div class="login-screen">
    <div class="login-box">
        <div class="logo">
            <div class="logo-icon">🔑</div>
            <div class="logo-text"><h1>FastPrint</h1><span>Redefinir Senha</span></div>
        </div>

        <!-- Carregando -->
        <div id="stateLoading" style="text-align:center; color:var(--text-secondary); padding:1.5rem 0;">
            <div class="spinner" style="margin: 0 auto 0.75rem;"></div>
            Verificando link...
        </div>

        <!-- Token inválido / expirado -->
        <div id="stateInvalid" style="display:none; text-align:center; padding:0.5rem 0;">
            <div style="font-size:2.5rem; margin-bottom:0.75rem;">⚠️</div>
            <p id="invalidMsg" style="color:var(--error); margin-bottom:1rem; font-weight:600;">Link inválido ou expirado</p>
            <p style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:1.5rem;">
                Solicite um novo link ao administrador do sistema.
            </p>
            <a href="/" style="color:var(--accent); font-size:0.85rem;">← Voltar ao FastPrint</a>
        </div>

        <!-- Formulário -->
        <div id="stateForm" style="display:none;">
            <p style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:1.5rem;">
                Olá, <strong id="greetingName" style="color:var(--text-primary);"></strong>.
                Defina sua nova senha abaixo.
            </p>
            <div class="login-error" id="formError">Erro ao redefinir senha</div>
            <form onsubmit="submitReset(event)">
                <div class="input-group">
                    <label>Nova senha</label>
                    <input type="password" id="novaSenha" placeholder="Mín. 8 caracteres" required minlength="8" autocomplete="new-password">
                </div>
                <div class="input-group">
                    <label>Confirmar senha</label>
                    <input type="password" id="confirmarSenha" placeholder="Repita a senha" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; margin-top:0.5rem;">
                    Redefinir Senha
                </button>
            </form>
        </div>

        <!-- Sucesso -->
        <div id="stateSuccess" style="display:none; text-align:center; padding:0.5rem 0;">
            <div style="font-size:2.5rem; margin-bottom:0.75rem;">✅</div>
            <h3 style="margin-bottom:0.5rem;">Senha redefinida!</h3>
            <p style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:1.5rem;">
                Sua senha foi atualizada com sucesso.
            </p>
            <a href="/" class="btn btn-primary" style="display:inline-block; text-decoration:none;">
                Ir para o login
            </a>
        </div>
    </div>
</div>

<script type="module" src="/static/js/reset-password.js"></script>
</body>
</html>
